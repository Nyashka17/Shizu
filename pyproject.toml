[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shizu", "shizu.*"]

[project]
name = "shizu"
version = "1.0.5"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiohttp>=3.10.5,<4.0.0",
    "aiohttp-jinja2>=1.5,<2.0.0",
    "aiogram>=3.15.0,<4.0.0",
    "cryptography>=43.0.0",
    "gitpython>=3.1.62",
    "grapheme>=0.6.0",
    "jinja2==3.1.2",
    "kurigram @ git+https://github.com/kurigram-org/kurigram",
    "lightdb>=2.0",
    "loguru>=0.7.3",
    "meval>=2.5",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "telethon>=1.45.0",
    "tgcrypto>=1.2.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF006"]
ignore = ["E501", "E731", "B019", "B905", "ASYNC109", "ASYNC230", "ASYNC240", "UP042"]

[tool.ruff.lint.per-file-ignores]
"shizu/inline/__init__.py" = ["F401"]
"shizu/modules/core/ShizuTester.py" = ["ASYNC251"]
